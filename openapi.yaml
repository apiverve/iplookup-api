openapi: 3.0.4
info:
  title: IP Lookup
  description: >-
    IP Lookup is an IP address location API that resolves any IP to its country,
    region, timezone and continent, with the country's currency, calling code,
    languages and flag and the local time there. Private and reserved addresses
    are labelled instead of failing. Paid plans add city, coordinates, postal
    code, an accuracy radius, an EU-membership flag, ASN and the reverse DNS
    hostname.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/iplookup:
    get:
      summary: IP Lookup
      description: Lookup the details and location of an IP address
      operationId: iplookup
      parameters:
        - name: ip
          in: query
          schema:
            type: string
          required: true
          description: >-
            The IP address for which you want to get the location data (e.g.,
            173.172.81.20)
          example: 173.172.81.20
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  ip: 173.172.81.20
                  country: US
                  countryName: United States
                  region: NE
                  regionName: Nebraska
                  city: Lincoln
                  continent: NA
                  continentName: North America
                  timezone: America/Chicago
                  coordinates:
                    - 40.7579
                    - -96.6962
                  postalCode: '68512'
                  accuracyRadius: 20
                  isEU: false
                  asn: AS11427
                  asnName: TWC-11427-TEXAS
                  ipVersion: 4
                  isPublic: true
                  reservedType: null
                  countryCode3: USA
                  capital: Washington D.C.
                  callingCode: '+1'
                  currency:
                    code: USD
                    name: United States dollar
                    symbol: $
                  languages:
                    - English
                  flag: 🇺🇸
                  tld: .us
                  utcOffset: '-05:00'
                  localTime: '2026-10-26T20:28:33-05:00'
                  isDst: true
                  hostname: syn-173-172-081-020.res.spectrum.com
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
